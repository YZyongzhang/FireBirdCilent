<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>每日计划 | 简约待办Demo</title>
    <!-- 使用 Google Fonts 提升字体美观度 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (免费图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f7ff 0%, #e9eef5 100%);
            font-family: 'Inter', sans-serif;
            padding: 2rem 1.5rem;
            color: #1e2a3e;
            min-height: 100vh;
        }

        /* 主容器 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(2px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2), 0 2px 5px rgba(0,0,0,0.02);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* 头部区域 */
        .hero {
            background: #ffffffcc;
            backdrop-filter: blur(8px);
            padding: 1.8rem 2rem 1.2rem 2rem;
            border-bottom: 1px solid rgba(100, 108, 118, 0.12);
        }

        .date-badge {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .date {
            font-size: 0.9rem;
            font-weight: 500;
            background: #eef2ff;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            color: #2c3e66;
            letter-spacing: 0.3px;
        }

        .quote {
            font-size: 0.8rem;
            color: #5b6e8c;
            font-style: italic;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1f2b48, #2c3e66);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 0.5rem 0 0.2rem 0;
        }

        .sub {
            color: #4a5b7a;
            font-size: 0.85rem;
            font-weight: 400;
            border-left: 3px solid #7c8db0;
            padding-left: 0.75rem;
            margin-top: 0.25rem;
        }

        /* 统计卡片 */
        .stats {
            display: flex;
            gap: 1rem;
            padding: 1rem 2rem;
            background: #fefefecc;
            border-bottom: 1px solid #e2e8f0;
            justify-content: space-between;
        }

        .stat-card {
            background: white;
            border-radius: 1.5rem;
            padding: 0.5rem 1.2rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            flex: 1;
            text-align: center;
            border: 1px solid #eef2ff;
        }

        .stat-number {
            font-size: 1.6rem;
            font-weight: 800;
            color: #2c3e66;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6a7b9b;
            font-weight: 500;
        }

        /* 新增任务栏 */
        .add-task {
            padding: 1.2rem 2rem 0.5rem 2rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-task input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 2rem;
            font-size: 0.95rem;
            font-family: 'Inter', monospace;
            background: white;
            transition: 0.2s;
            outline: none;
            font-weight: 500;
            color: #1f2a3e;
        }

        .add-task input:focus {
            border-color: #8ba0c7;
            box-shadow: 0 0 0 3px rgba(99, 128, 180, 0.2);
        }

        .add-task button {
            background: #2c3e66;
            border: none;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 2.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .add-task button:hover {
            background: #1f2b48;
            transform: translateY(-1px);
        }

        /* 任务列表区域 */
        .task-list-container {
            padding: 0.5rem 1.8rem 2rem 1.8rem;
        }

        .tasks-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #5a6e8a;
            letter-spacing: 0.3px;
            padding: 0 0.2rem;
        }

        .tasks {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .task-item {
            background: white;
            border-radius: 1.3rem;
            padding: 0.8rem 1rem 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid #eef2fa;
            transition: all 0.2s;
        }

        .task-item:hover {
            border-color: #cdd9f0;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
            transform: scale(1.01);
        }

        .task-check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #b9c4dd;
            background: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            color: white;
            font-size: 12px;
            flex-shrink: 0;
        }

        .task-check.completed {
            background: #2c3e66;
            border-color: #2c3e66;
            color: white;
        }

        .task-text {
            flex: 1;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1e2f41;
            word-break: break-word;
            padding-right: 0.5rem;
        }

        .task-text.line-through {
            text-decoration: line-through;
            color: #92a1bc;
        }

        .task-priority {
            font-size: 0.7rem;
            background: #f0f3fa;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            color: #4a6085;
            font-weight: 600;
        }

        .delete-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #b7c2da;
            font-size: 1.1rem;
            transition: 0.15s;
            padding: 4px 6px;
            border-radius: 30px;
        }

        .delete-btn:hover {
            color: #e25c5c;
            background: #fff3f0;
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1.5rem;
            background: #fafcff;
            border-radius: 1.8rem;
            color: #8698b5;
            font-weight: 500;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            opacity: 0.5;
        }

        /* 番茄钟小工具 (demo趣味组件) */
        .pomodoro-tool {
            margin: 0 1.8rem 1.5rem 1.8rem;
            background: #ffffffcc;
            border-radius: 1.4rem;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            backdrop-filter: blur(2px);
            border: 1px solid #ffffff;
        }

        .pomo-text {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #2c3e66;
        }

        .timer {
            font-family: monospace;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: #eef2ff;
            padding: 0.2rem 0.8rem;
            border-radius: 3rem;
        }

        .pomo-buttons button {
            background: #eef2fa;
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 30px;
            font-weight: 600;
            margin-left: 6px;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.75rem;
        }

        .pomo-buttons button:active {
            transform: scale(0.96);
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            padding: 1rem;
            color: #8a9bbb;
            border-top: 1px solid #eef2fa;
            background: #ffffffd9;
        }

        @media (max-width: 550px) {
            body {
                padding: 1rem;
            }
            .add-task {
                flex-direction: column;
                align-items: stretch;
            }
            .stats {
                flex-direction: column;
                gap: 0.7rem;
            }
            .stat-card {
                padding: 0.4rem;
            }
            .pomodoro-tool {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .timer {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部 -->
    <div class="hero">
        <div class="date-badge">
            <span class="date" id="currentDate"></span>
            <span class="quote"><i class="fa-regular fa-sun"></i> 把握今日</span>
        </div>
        <h1>每日计划</h1>
        <div class="sub">✍️ 记录要事 · 逐步完成 · 保持节奏</div>
    </div>

    <!-- 统计卡片 (仅展示数据, 动态) -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">全部任务</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="completedCount">0</div>
            <div class="stat-label">已完成</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="pendingCount">0</div>
            <div class="stat-label">进行中</div>
        </div>
    </div>

    <!-- 新增任务栏 -->
    <div class="add-task">
        <input type="text" id="taskInput" placeholder="写一个计划，比如 '完成报告' 或 '晨跑30分钟'" autocomplete="off">
        <button id="addTaskBtn"><i class="fas fa-plus-circle"></i> 添加计划</button>
    </div>

    <!-- 列表头部 -->
    <div class="task-list-container">
        <div class="tasks-header">
            <span><i class="fa-regular fa-list-check"></i> 今日待办清单</span>
            <span style="font-size:0.7rem;">✔️点击圆点完成 / ❌删除</span>
        </div>
        <ul class="tasks" id="taskList">
            <!-- 动态渲染任务 -->
            <li class="empty-state">
                <i class="fa-regular fa-clipboard"></i><br>
                暂无任务，添加一项计划吧 ✨
            </li>
        </ul>
    </div>

    <!-- 趣味彩蛋组件：迷你番茄钟，不影响核心计划，增加趣味 -->
    <div class="pomodoro-tool">
        <div class="pomo-text">
            <i class="fa-regular fa-clock"></i> 专注小憩·番茄钟
            <span class="timer" id="timerDisplay">25:00</span>
        </div>
        <div class="pomo-buttons">
            <button id="startTimerBtn"><i class="fas fa-play"></i> 开始</button>
            <button id="resetTimerBtn"><i class="fas fa-undo-alt"></i> 重置</button>
        </div>
    </div>
    <footer>
        <i class="fa-regular fa-calendar-check"></i> 每日计划Demo · 轻松管理今日任务
    </footer>
</div>

<script>
    (function(){
        // ---------- 任务数据存储 ----------
        let tasks = [];

        // 从 localStorage 加载示例数据（初始化一些示例任务更美观）
        function loadSampleData() {
            const stored = localStorage.getItem("dailyPlanTasks");
            if (stored) {
                try {
                    tasks = JSON.parse(stored);
                    if(!Array.isArray(tasks)) tasks = [];
                } catch(e) { tasks = []; }
            }
            // 如果没有存储，内置3个友好的样例（让demo看起来生动）
            if(!stored || tasks.length === 0){
                tasks = [
                    { id: Date.now() + 1, text: "制定明天的计划", completed: false, priority: "重要" },
                    { id: Date.now() + 2, text: "阅读 30 分钟", completed: true, priority: "学习" },
                    { id: Date.now() + 3, text: "整理工作笔记", completed: false, priority: "工作" },
                ];
                saveTasks();
            }
        }

        function saveTasks() {
            localStorage.setItem("dailyPlanTasks", JSON.stringify(tasks));
            updateStatsAndRender();
        }

        // 更新统计 + 渲染UI
        function updateStatsAndRender() {
            updateStats();
            renderTaskList();
        }

        // 统计数据
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            document.getElementById('totalCount').innerText = total;
            document.getElementById('completedCount').innerText = completed;
            document.getElementById('pendingCount').innerText = pending;
        }

        // 渲染任务列表
        function renderTaskList() {
            const taskListEl = document.getElementById('taskList');
            if (!tasks.length) {
                taskListEl.innerHTML = `<li class="empty-state">
                                            <i class="fa-regular fa-clipboard"></i><br>
                                            暂无任务，添加一项计划吧 ✨
                                        </li>`;
                return;
            }

            // 排序规则: 未完成的在前，已完成的在后; 同状态按id顺序（新添加靠后）
            const sorted = [...tasks].sort((a,b) => {
                if(a.completed !== b.completed) return a.completed ? 1 : -1;
                return a.id - b.id;
            });

            const fragment = document.createDocumentFragment();
            sorted.forEach(task => {
                const li = document.createElement('li');
                li.className = 'task-item';
                li.dataset.id = task.id;

                // 复选框图标
                const checkSpan = document.createElement('div');
                checkSpan.className = `task-check ${task.completed ? 'completed' : ''}`;
                if (task.completed) {
                    checkSpan.innerHTML = '<i class="fas fa-check" style="font-size: 10px;"></i>';
                } else {
                    checkSpan.innerHTML = ' ';
                }
                checkSpan.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleTaskComplete(task.id);
                });

                // 文本
                const textSpan = document.createElement('span');
                textSpan.className = `task-text ${task.completed ? 'line-through' : ''}`;
                textSpan.innerText = task.text;

                // 简易标签样式 (取自priority字段 或 默认 "计划")
                let priorityLabel = task.priority || "日常";
                if(priorityLabel.length > 6) priorityLabel = priorityLabel.slice(0,6);
                const prioritySpan = document.createElement('span');
                prioritySpan.className = 'task-priority';
                prioritySpan.innerText = priorityLabel;

                // 删除按钮
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '<i class="fa-regular fa-trash-can"></i>';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteTaskById(task.id);
                });

                li.appendChild(checkSpan);
                li.appendChild(textSpan);
                li.appendChild(prioritySpan);
                li.appendChild(delBtn);
                fragment.appendChild(li);
            });
            taskListEl.innerHTML = '';
            taskListEl.appendChild(fragment);
        }

        // 添加新任务
        function addTask(taskText) {
            if(!taskText || taskText.trim() === "") {
                // 轻提示样式（简单提示）
                const inputEl = document.getElementById('taskInput');
                inputEl.style.borderColor = "#e25c5c";
                setTimeout(() => { inputEl.style.borderColor = "#e2e8f0"; }, 800);
                return false;
            }
            const cleanText = taskText.trim();
            // 简单判断优先级分类 (可有可无，只是好看 提取关键词)
            let priority = "日常";
            if(cleanText.includes("重要") || cleanText.includes("紧急")) priority = "重要";
            else if(cleanText.includes("会议") || cleanText.includes("工作")) priority = "工作";
            else if(cleanText.includes("学习") || cleanText.includes("读书") || cleanText.includes("笔记")) priority = "学习";
            else if(cleanText.includes("健身") || cleanText.includes("跑步") || cleanText.includes("运动")) priority = "健康";
            
            const newTask = {
                id: Date.now(),
                text: cleanText,
                completed: false,
                priority: priority,
            };
            tasks.push(newTask);
            saveTasks();
            // 清空输入框
            document.getElementById('taskInput').value = '';
            return true;
        }

        // 切换完成状态
        function toggleTaskComplete(taskId) {
            const task = tasks.find(t => t.id == taskId);
            if(task) {
                task.completed = !task.completed;
                saveTasks();
            }
        }

        // 删除任务
        function deleteTaskById(taskId) {
            tasks = tasks.filter(t => t.id != taskId);
            saveTasks();
        }

        // 修改日期显示
        function setDateDisplay() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const formatted = now.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
            document.getElementById('currentDate').innerHTML = `<i class="fa-regular fa-calendar"></i> ${formatted}`;
        }

        // ---------- 番茄钟 demo (独立功能，美观互动) ----------
        let timerInterval = null;
        let isRunning = false;
        let currentSeconds = 25 * 60; // 25分钟 = 1500秒
        const timerElement = document.getElementById('timerDisplay');

        function updateTimerDisplay() {
            const mins = Math.floor(currentSeconds / 60);
            const secs = currentSeconds % 60;
            timerElement.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }

        function stopTimer() {
            if(timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isRunning = false;
        }

        function startTimerCountdown() {
            if(isRunning) return;
            if(currentSeconds <= 0) {
                // 如果已经到0，重置为25分钟再开始? 更好的体验：重置提醒
                currentSeconds = 25*60;
                updateTimerDisplay();
            }
            isRunning = true;
            timerInterval = setInterval(() => {
                if(currentSeconds <= 1) {
                    // 倒计时结束
                    stopTimer();
                    currentSeconds = 0;
                    updateTimerDisplay();
                    // 简单提醒
                    if(window.Notification && Notification.permission === "granted") {
                        new Notification("🍅 番茄钟结束", { body: "专注时间到！休息一下吧~" });
                    } else {
                        alert("🍅 番茄钟结束！休息一下吧~");
                    }
                    // 重置秒数为0可再reset
                } else {
                    currentSeconds--;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function resetTimer() {
            stopTimer();
            currentSeconds = 25 * 60;
            updateTimerDisplay();
            isRunning = false;
        }

        // 请求通知权限(可选)
        if (window.Notification && Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }

        // 绑定事件监听
        function bindEvents() {
            const addBtn = document.getElementById('addTaskBtn');
            const taskInput = document.getElementById('taskInput');
            addBtn.addEventListener('click', () => {
                addTask(taskInput.value);
            });
            taskInput.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    e.preventDefault();
                    addTask(taskInput.value);
                }
            });

            // 番茄钟按钮
            const startBtn = document.getElementById('startTimerBtn');
            const resetBtn = document.getElementById('resetTimerBtn');
            if(startBtn) startBtn.addEventListener('click', startTimerCountdown);
            if(resetBtn) resetBtn.addEventListener('click', resetTimer);
        }

        // 页面关闭前保存一次（已经是实时save）但不用额外操作
        window.addEventListener('beforeunload', () => {
            saveTasks();
            if(timerInterval) clearInterval(timerInterval);
        });

        // 初始化功能
        function init() {
            loadSampleData();  // 加载或样例
            setDateDisplay();
            bindEvents();
            updateStatsAndRender();   // 渲染界面
            // 重置一下番茄钟显示
            resetTimer();
        }

        init();
    })();
</script>
</body>
</html>
